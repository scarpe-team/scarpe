[package]
name = "scarpe-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Native display service for Scarpe: draws Shoes apps with tiny-skia and cosmic-text"
license = "MIT"
publish = false

[lib]
name = "scarpe_native"
path = "src/lib.rs"

[[bin]]
name = "scarpe-native"
path = "src/main.rs"

[dependencies]
tiny-skia = "0.12"
cosmic-text = "0.19"
swash = "0.2"
winit = "0.30"
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Screen readers (src/a11y.rs): the tree, the winit 0.30 adapter, and the consumer that reads a
# tree back the way the platform adapters do (the `a11y` automation op).
accesskit = "0.24"
accesskit_consumer = "0.38"
accesskit_winit = "0.32"

[profile.release]
debug = false

# A debug frame is about 60x slower without optimised dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Colour-space matching on the window (window.rs). Already in the tree through softbuffer and rfd.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
