# Based on https://raw.githubusercontent.com/actions/starter-workflows/main/pages/jekyll.yml

name: Deploy YARD documentation to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # Pinned: ubuntu-latest moves to 26.04 from October 2026.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # webview_ruby compiles against GTK and WebKitGTK while the bundle installs. It asks
      # pkg-config for webkit2gtk-4.0, which Ubuntu no longer ships; 4.1 is the same API on
      # libsoup 3, so it answers to the old name (as in native.yml).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          printf '%s\n' 'Name: webkit2gtk-4.0' 'Description: webkit2gtk-4.1 under its old name' \
            'Version: 2.0' 'Requires: webkit2gtk-4.1' > "$RUNNER_TEMP/pkgconfig/webkit2gtk-4.0.pc"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/pkgconfig" >> "$GITHUB_ENV"
      # v1.146.0 predates Ubuntu 24.04 and took it for a self-hosted runner with no Ruby.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with yardoc
        run: rm -rf .yardoc doc && bundle exec yardoc -o doc
        env:
          FAKE_ENV: example
      - name: Push yardoc files to pages branch
        run: |
          set -e
          set -x
          git switch --orphan new_pages
          find . -mindepth 1 -maxdepth 1 ! \( -name "doc" -o -name ".git" \) -exec rm -rf {} ';'
          mv doc/* .
          touch .nojekyll
          rmdir doc
          git add .
          git config user.email "builder@example.com"
          git config user.name "Docs Builder"
          git commit -m "New docs build"
          git checkout -b pages || git checkout pages
          git reset --hard new_pages
          git push -f origin pages

