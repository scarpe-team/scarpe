---
name: CI
on:
  push:
    branches:
      - main
    # Don't run push event if there's an associated PR
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Skip push runs if PR exists
    if: github.event_name != 'push' || github.event.pull_request == null
    name: Tests
    # Pinned: macos-latest moves to each new macOS a few months after release.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # nokogiri builds from source here, unpacking libxml2 with xzcat (native.yml says more).
      - name: xzcat for nokogiri's source build
        run: command -v xzcat || brew install xz
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          # Not .ruby-version's 3.2.0: clang 21 (Xcode 26, on macos-26) warns inside Ruby
          # 3.2.0's own headers, nokogiri's configure checks run with -Werror, and a cold
          # bundle then fails to install. 3.2.11 fixed the header.
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run Lacci tests
        run: CI_RUN='true' bundle exec rake lacci_test
      - name: Run Scarpe-Component tests
        run: CI_RUN='true' bundle exec rake component_test
      - name: Check HTML output
        run: bundle exec rake test:check_html_fixtures

      - name: Run Scarpe tests
        run: CI_RUN='true' bundle exec rake test
      - name: upload test-fail logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test failure logs
          path: logger/test_failure*.out.log
          if-no-files-found: ignore
